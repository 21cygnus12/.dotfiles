source=~/.config/hypr/mocha.conf

$terminal = footclient
$menu = tofi-drun --drun-launch=true
$browser = librewolf -p

exec = foot --server
exec-once = mako
exec-once = /usr/lib/polkit-kde-authentication-agent-1

env = HYPERCURSOR_THEME,catppuccin-mocha-blue
env = HYPRCURSOR_SIZE,20
env = XCURSOR_THEME,catppuccin-mocha-blue
env = XCURSOR_SIZE,20

general { 
    gaps_in = 3
    gaps_out = 0

    border_size = 1

    col.active_border = $text
    col.inactive_border = $base

    resize_on_border = false 

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow:enabled = false
    blur:enabled = false
}

animations:enabled = false

dwindle {
    preserve_split = true
    force_split = 2
}

misc { 
    force_default_wallpaper = 0
    disable_splash_rendering = true
    disable_hyprland_logo = false
    vfr = true
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = false
    }
}

gestures {
    workspace_swipe = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_SINK@ 5%+ && notify-send "$(wpctl get-volume @DEFAULT_SINK@)"
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_SINK@ 5%- && notify-send "$(wpctl get-volume @DEFAULT_SINK@)"
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle && notify-send "$(wpctl get-volume @DEFAULT_SINK@)"

binde = , XF86MonBrightnessUp, exec, brightnessctl set +5% && notify-send "$(brightnessctl -m | awk -F, '{print $4}')" 
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && notify-send "$(brightnessctl -m | awk -F, '{print $4}')" 

$mainMod = SUPER

bind = $mainMod, b, exec, notify-send "$(acpi -b)"
bind = $mainMod, t, exec, notify-send "$(date +"%A, %B %d %l:%M %p")"

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, exec, $browser Personal
bind = $mainMod SHIFT, W, exec, $browser Personal --private-window
bind = $mainMod, E, exec, $browser School
bind = $mainMod SHIFT, E, exec, $browser School --private-window
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo,
bind = $mainMod, SPACE, togglesplit,

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = noborder, onworkspace:w[t1]
